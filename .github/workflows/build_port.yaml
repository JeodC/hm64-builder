name: Build port

on:
  workflow_call:
    inputs:
      port-name:
        description: "Port name (human-readable)"
        required: true
        type: string
      short-name:
        description: "Short name (used in release tags)"
        required: true
        type: string
      port:
        description: "Port identifier (matches builds/<port>.txt and zip top-level dir)"
        required: true
        type: string
      build-type:
        description: "Build type"
        required: true
        type: string
      upstream-repo:
        description: "Upstream repository"
        required: true
        type: string
      force-build:
        description: "Force build (nightly)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            releases
            tools
            builds
            SOURCE_SETUP.txt
          sparse-checkout-cone-mode: false

      - name: Fetch latest upstream release tag
        id: upstream
        run: |
          if [[ "${{ inputs.force-build }}" == "true" ]]; then
            echo "Force build: skipping upstream release lookup"
            echo "UPSTREAM_TAG=nightly" >> $GITHUB_ENV
            echo "UPSTREAM_BODY=Nightly build from latest commit." >> $GITHUB_ENV
          else
            response=$(curl -sf https://api.github.com/repos/${{ inputs.upstream-repo }}/releases/latest || true)
            upstream_tag=$(echo "$response" | jq -r .tag_name)
            upstream_body=$(echo "$response" | jq -r .body)

            if [[ -z "$upstream_tag" || "$upstream_tag" == "null" ]]; then
              echo "No upstream stable release found."
              echo "UPSTREAM_TAG=" >> $GITHUB_ENV
              echo "UPSTREAM_BODY=" >> $GITHUB_ENV
            else
              echo "UPSTREAM_TAG=$upstream_tag" >> $GITHUB_ENV
              echo "UPSTREAM_BODY<<EOF" >> $GITHUB_ENV
              echo "$upstream_body" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
            fi
          fi

      - name: Fetch latest origin release tag
        id: origin
        run: |
          origin_tag=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases" \
            | jq -r '.[] | select(.tag_name | startswith("${{ inputs.short-name }}-release-")) | .tag_name' \
            | head -n1)
          origin_version="${origin_tag#*-release-}"
          echo "ORIGIN_VERSION=$origin_version" >> $GITHUB_ENV

      - name: Normalize upstream and origin tags for version comparison
        id: normalize
        run: |
          if [[ "${{ inputs.force-build }}" == "true" ]]; then
            nightly_version="$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
            echo "UPSTREAM_VERSION=$nightly_version" >> $GITHUB_ENV
            echo "ORIGIN_VERSION=" >> $GITHUB_ENV
          else
            upstream_version="${UPSTREAM_TAG#v}"
            origin_version="${ORIGIN_VERSION#v}"
            echo "UPSTREAM_VERSION=${upstream_version}" >> $GITHUB_ENV
            echo "ORIGIN_VERSION=${origin_version}" >> $GITHUB_ENV
          fi

      - name: Compare versions
        id: compare
        run: |
          if [[ "${{ inputs.force-build }}" == "true" ]]; then
            echo "Force build enabled (nightly)."
            echo "build=true" >> $GITHUB_ENV
          elif [[ -z "$UPSTREAM_VERSION" ]]; then
            echo "No upstream stable release found, skipping build."
            echo "build=false" >> $GITHUB_ENV
          elif [[ -z "$ORIGIN_VERSION" || "$UPSTREAM_VERSION" != "$ORIGIN_VERSION" ]]; then
            echo "Version mismatch or no origin release found. Proceeding with build..."
            echo "build=true" >> $GITHUB_ENV
          else
            echo "Versions are the same. Skipping build."
            echo "build=false" >> $GITHUB_ENV
          fi

      - name: Build port
        if: env.build == 'true'
        env:
          FORCE_HEAD: ${{ inputs.force-build }}
          BUILD_TYPE: ${{ inputs.build-type }}
        run: |
          ./tools/build_port.sh ${{ inputs.port }}

      - name: Create zip file
        if: env.build == 'true'
        run: |
          rm -rf ${{ inputs.port }}/*.part.[0-9]*
          zip -r ${{ inputs.port }}.zip ${{ inputs.port }}

      - name: Set release tag
        if: env.build == 'true'
        run: |
          if [[ "${{ inputs.force-build }}" == "true" ]]; then
            echo "RELEASE_TAG=${{ inputs.short-name }}-nightly" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${{ inputs.short-name }}-${{ inputs.build-type }}-${{ env.UPSTREAM_VERSION }}" >> $GITHUB_ENV
          fi
   
      - name: Create release
        if: env.build == 'true'
        uses: "ncipollo/release-action@v1.21.0"
        with:
          tag: ${{ env.RELEASE_TAG }}
          body: "${{ env.UPSTREAM_BODY }}"
          artifacts: ${{ inputs.port }}.zip
          prerelease: ${{ inputs.force-build }}
          makeLatest: false
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Ports Repo
        if: env.build == 'true' && inputs.force-build != true
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PORTS_REPO_PAT }}
          repository: JeodC/RHH-Ports
          event-type: hm64_update
          client-payload: >
            {
              "version": "${{ env.UPSTREAM_VERSION }}",
              "zip_url": "https://github.com/JeodC/hm64-builder/releases/download/${{ env.RELEASE_TAG }}/${{ inputs.port }}.zip"
            }

      # On scheduled (cron) failures, open or comment on a tracking issue so that
      # silent breakage gets noticed. Skipped for workflow_dispatch — manual runs
      # are interactive and any failure is already visible to the operator.
      # Body includes the failed step name and the tail of its log so you can
      # triage from the issue without clicking through to the run.
      - name: Open or update failure issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        env:
          PORT_NAME: ${{ inputs.port-name }}
          SHORT_NAME: ${{ inputs.short-name }}
          UPSTREAM_VERSION: ${{ env.UPSTREAM_VERSION }}
        with:
          script: |
            const TAIL_LINES = 30;
            const portName = process.env.PORT_NAME;
            const shortName = process.env.SHORT_NAME;
            const upstreamVersion = process.env.UPSTREAM_VERSION || 'unknown';
            const titlePrefix = `[auto] ${shortName} build failure`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Find the failed job for this run. There should be exactly one
            // because each port build is a separate top-level job; we filter by
            // matrix-style name match in case the runner returns multiple.
            const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const failedJob = jobsData.jobs.find(j =>
              j.status === 'completed' && j.conclusion === 'failure'
            );

            // Identify the first failed step (typically the actual cause).
            let failedStepName = '(unknown)';
            if (failedJob) {
              const failedStep = (failedJob.steps || []).find(s => s.conclusion === 'failure');
              if (failedStep) failedStepName = failedStep.name;
            }

            // Pull the job log. The API returns a redirect to a plain-text log
            // (not a zip — that's the run-level endpoint). github-script's Octokit
            // follows redirects automatically and gives us the body as ArrayBuffer.
            let logTail = '(log unavailable)';
            if (failedJob) {
              try {
                const logResp = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  job_id: failedJob.id,
                });
                const text = Buffer.from(logResp.data).toString('utf8');
                const allLines = text.split(/\r?\n/);
                // Trim trailing blank lines that bloat the tail.
                while (allLines.length && allLines[allLines.length - 1] === '') allLines.pop();
                logTail = allLines.slice(-TAIL_LINES).join('\n');
              } catch (e) {
                core.warning(`Failed to fetch job log: ${e.message}`);
              }
            }

            const body = [
              `Scheduled build of **${portName}** failed at step **${failedStepName}**.`,
              ``,
              `- Upstream version: \`${upstreamVersion}\``,
              `- Workflow run: ${runUrl}`,
              ``,
              `Last ${TAIL_LINES} lines of the failed job log:`,
              '```',
              logTail,
              '```',
            ].join('\n');

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'auto-build-failure',
              per_page: 100,
            });
            const existing = openIssues.find(i => i.title.startsWith(titlePrefix));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Commented on existing issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${titlePrefix} (${upstreamVersion})`,
                body,
                labels: ['auto-build-failure'],
              });
              core.info(`Created new issue #${created.number}`);
            }
