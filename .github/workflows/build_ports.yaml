name: Build Ports
on:
  workflow_dispatch:
  schedule:
    - cron: '00 14 * * *'
    - cron: '0 2 * * *'

jobs:
  build-soh:
    name: Build Ship of Harkinian
    uses: ./.github/workflows/build_port.yaml
    with:
      port-name: "Ship of Harkinian"
      short-name: SoH
      port-dir: soh
      build-type: release
      upstream-repo: "HarbourMasters/Shipwright"
    secrets: inherit

  build-soh2:
    name: Build Ship of Harkinian 2
    uses: ./.github/workflows/build_port.yaml
    with:
      port-name: "Ship of Harkinian 2"
      short-name: SoH2
      port-dir: soh2
      build-type: release
      upstream-repo: "HarbourMasters/2ship2harkinian"
    secrets: inherit
      
  build-starship:
    name: Build Starship
    uses: ./.github/workflows/build_port.yaml
    with:
      port-name: "Starship"
      short-name: Starship
      port-dir: starship
      build-type: release
      upstream-repo: "HarbourMasters/Starship"
    secrets: inherit
      
  build-spaghettikart:
    name: Build SpaghettiKart
    uses: ./.github/workflows/build_port.yaml
    with:
      port-name: "SpaghettiKart"
      short-name: SpaghettiKart
      port-dir: spaghettikart
      build-type: release
      upstream-repo: "HarbourMasters/SpaghettiKart"
    secrets: inherit
      
  build-ghostship:
    name: Build Ghostship
    uses: ./.github/workflows/build_port.yaml
    with:
      port-name: "Ghostship"
      short-name: Ghostship
      port-dir: sm64-ghostship
      build-type: release
      upstream-repo: "HarbourMasters/Ghostship"
    secrets: inherit
