name: Build Ports
on:
  workflow_dispatch:
    inputs:
      force-port:
        description: "Force build a specific port (bypass version check)"
        type: choice
        required: false
        default: none
        options:
          - none
          - soh
          - soh2
          - starship
          - spaghettikart
          - ghostship
          - paperboat
  schedule:
    - cron: '00 14 * * *'
    - cron: '0 2 * * *'

jobs:
  build-soh:
    name: Build Ship of Harkinian
    uses: ./.github/workflows/build_port.yaml
    with:
      port-name: "Ship of Harkinian"
      short-name: SoH
      port: soh
      build-type: release
      upstream-repo: "HarbourMasters/Shipwright"
      force-build: ${{ github.event.inputs.force-port == 'soh' }}
    secrets: inherit

  build-soh2:
    name: Build 2Ship2Harkinian
    uses: ./.github/workflows/build_port.yaml
    with:
      port-name: "2Ship2Harkinian"
      short-name: SoH2
      port: soh2
      build-type: release
      upstream-repo: "HarbourMasters/2ship2harkinian"
      force-build: ${{ github.event.inputs.force-port == 'soh2' }}
    secrets: inherit
      
  build-starship:
    name: Build Starship
    uses: ./.github/workflows/build_port.yaml
    with:
      port-name: "Starship"
      short-name: Starship
      port: starship
      build-type: release
      upstream-repo: "HarbourMasters/Starship"
      force-build: ${{ github.event.inputs.force-port == 'starship' }}
    secrets: inherit
      
  build-spaghettikart:
    name: Build SpaghettiKart
    uses: ./.github/workflows/build_port.yaml
    with:
      port-name: "SpaghettiKart"
      short-name: SpaghettiKart
      port: spaghettikart
      build-type: release
      upstream-repo: "HarbourMasters/SpaghettiKart"
      force-build: ${{ github.event.inputs.force-port == 'spaghettikart' }}
    secrets: inherit
      
  build-ghostship:
    name: Build Ghostship
    uses: ./.github/workflows/build_port.yaml
    with:
      port-name: "Ghostship"
      short-name: Ghostship
      port: sm64-ghostship
      build-type: release
      upstream-repo: "HarbourMasters/Ghostship"
      force-build: ${{ github.event.inputs.force-port == 'ghostship' }}
    secrets: inherit
    
  build-paperboat:
    name: Build Paperboat
    uses: ./.github/workflows/build_port.yaml
    with:
      port-name: "Paperboat"
      short-name: Paperboat
      port: paperboat
      build-type: release
      upstream-repo: "HarbourMasters/PaperBoat"
      force-build: ${{ github.event.inputs.force-port == 'paperboat' }}
    secrets: inherit
